services:
  - type: web
    name: wheatraja-api
    runtime: docker
    plan: free
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: ALLOW_DEV_OTP
        value: "false"
      - key: OTP_PROVIDER
        value: twilio
      - key: SMS_PROVIDER
        value: console
      - key: STORAGE_PROVIDER
        value: local
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://wheatraja-admin.vercel.app,https://wheatraja-website-website-self.vercel.app
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: ADMIN_PHONE_NUMBERS
        sync: false
      - key: ADMIN_DUMMY_LOGIN_ENABLED
        sync: false
      - key: ADMIN_DUMMY_OTP
        sync: false
